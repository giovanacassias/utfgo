<div data-app-shell-root class="min-h-screen bg-background text-text-primary lg:pl-62">
  <ng-template #menuContent>
    <div class="flex flex-1 flex-col gap-8 p-6">
      <a
        class="text-brand font-extrabold text-secondary"
        routerLink="/inicio"
        (click)="closeDrawer()"
      >
        UTFgo
      </a>

      <nav aria-label="Navegação principal" class="flex flex-col gap-2">
        <span class="text-caption font-semibold uppercase text-text-secondary">Navegação</span>
        @for (item of navigationItems; track item.path) {
          <a
            class="rounded-control px-4 py-3 text-small font-semibold text-text-secondary"
            [routerLink]="item.path"
            routerLinkActive="bg-tertiary text-on-tertiary"
            (click)="closeDrawer()"
          >
            {{ item.label }}
          </a>
        }
      </nav>

      <div class="mt-auto flex flex-col gap-4">
        <div class="border-t border-border pt-4 text-small text-text-secondary">
          <p class="font-semibold text-text-primary">Perfil ativo</p>
          <p>Passageiro</p>
        </div>
        <button
          data-app-shell-logout
          type="button"
          class="rounded-control px-4 py-3 text-left text-small font-semibold text-danger"
          (click)="logout()"
        >
          Sair
        </button>
      </div>
    </div>

    <footer
      data-app-shell-footer
      class="border-t border-border p-6 text-caption text-text-secondary"
    >
      <p>Acesso institucional UTFPR</p>
      <p>Ajuda e suporte</p>
    </footer>
  </ng-template>

  <aside
    #desktopSidebar
    data-app-shell-sidebar
    [attr.inert]="drawerOpen() ? '' : null"
    class="hidden lg:fixed lg:inset-y-0 lg:left-0 lg:flex lg:w-62 lg:flex-col lg:border-r lg:border-border lg:bg-background"
  >
    <ng-container [ngTemplateOutlet]="menuContent" />
  </aside>

  <div class="flex min-h-screen flex-col">
    <header
      data-app-shell-header
      [attr.inert]="drawerOpen() ? '' : null"
      class="flex min-h-12 items-center justify-between border-b border-border px-6 py-4 lg:px-10"
    >
      <div class="flex items-center gap-2">
        <button
          #menuToggle
          type="button"
          aria-label="Abrir menu"
          [attr.aria-expanded]="drawerOpen()"
          [attr.aria-controls]="drawerOpen() ? 'app-shell-mobile-drawer' : null"
          class="size-12 shrink-0 rounded-control text-title-small focus-visible:outline-2 focus-visible:outline-tertiary lg:hidden"
          (click)="drawerOpen.set(true)"
        >
          ☰
        </button>
        <div>
          <p class="text-caption font-semibold uppercase text-text-secondary">
            {{ activeNavigationItem().label }}
          </p>
          <h1 class="text-title font-bold">Olá, {{ session()?.user?.name }}</h1>
        </div>
      </div>
      <div class="text-small text-text-secondary">{{ session()?.wallet?.tokenBalance ?? 0 }} fichas</div>
    </header>

    @if (drawerOpen()) {
      <div class="fixed inset-0 z-50 lg:hidden">
        <div
          data-app-shell-backdrop
          aria-hidden="true"
          class="absolute inset-0 bg-secondary/50"
          (mousedown)="$event.preventDefault()"
          (click)="closeDrawer()"
        ></div>
        <div
          #mobileDrawer
          id="app-shell-mobile-drawer"
          role="dialog"
          aria-modal="true"
          aria-label="Menu lateral"
          tabindex="-1"
          class="relative flex h-full w-62 max-w-full flex-col overflow-y-auto border-r border-border bg-background"
          (keydown)="onDrawerKeydown($event, mobileDrawer)"
        >
          <button
            #drawerCloseButton
            type="button"
            aria-label="Fechar menu"
            class="mt-2 mr-2 size-12 shrink-0 self-end rounded-control text-title-small focus-visible:outline-2 focus-visible:outline-tertiary"
            (click)="closeDrawer()"
          >
            ×
          </button>
          <ng-container [ngTemplateOutlet]="menuContent" />
        </div>
      </div>
    }

    <main [attr.inert]="drawerOpen() ? '' : null" class="flex-1 px-6 py-8 lg:px-10">
      <router-outlet />
    </main>
  </div>
</div>
